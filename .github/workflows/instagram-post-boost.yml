name: Instagram Retrostock Boost

# Temporary: posts Retrostock photos specifically, 5x/day, on top of the
# normal twice-daily instagram-post.yml schedule, so the event gets real
# traction while it's still fresh rather than trickling out over ~2 months in
# the general rotation. Self-expires below — delete this file once the whole
# priority list below is exhausted or the expiry date passes, whichever comes
# first.
#
# instagram-post.cjs takes a priority list of categories now (2026-08-26) —
# it posts from the first one in the list that still has unposted photos, and
# automatically falls through to the next once one's exhausted. So this
# workflow no longer needs a manual category swap when one finishes: retrostock
# (136 photos, 0 posted as of 2026-08-26) is first, then drift-games (351
# photos) automatically picks up once retrostock clears. Add more categories
# to the end of the priority list below if you want to chain further ones.
#
# Repurposed 2026-08-26: previously boosted Bimmerfest (127 photos, finished
# 2026-08-25 19:56 UTC — DSC_6107-Enhanced-NR.jpg was the last one posted).

concurrency:
  group: track-bot-commits
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 1 * * *'   # 1:30am UTC
    - cron: '0 6 * * *'    # 6:00am UTC
    - cron: '30 10 * * *'  # 10:30am UTC
    - cron: '0 15 * * *'   # 3:00pm UTC
    - cron: '30 19 * * *'  # 7:30pm UTC
  workflow_dispatch:         # Manual trigger from GitHub UI (ignores expiry date)

jobs:
  boost:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check expiry
        id: expiry
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%Y-%m-%d)" \< "2027-01-31" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "Boost window expired (past 2027-01-31) — delete .github/workflows/instagram-post-boost.yml"
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.expiry.outputs.active == 'true'
        with:
          lfs: false  # Don't download image files — we only need filenames
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.expiry.outputs.active == 'true'
        with:
          node-version: "22"

      - name: Post next photo from priority list to Instagram
        if: steps.expiry.outputs.active == 'true'
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: node scripts/instagram-post.cjs retrostock drift-games

      - name: Commit updated queue
        if: steps.expiry.outputs.active == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add post-queue.json
          git diff --staged --quiet || git commit -m "[CI Skip] chore: update Instagram post queue (boost)"
          # No pull --rebase here — same LFS pointer reason as instagram-post.yml.
          git push
