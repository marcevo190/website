name: Deploy to Cloudflare

# Builds the site (watermark + astro) and uploads to the Cloudflare Worker
# (wrangler.json) on every push to main. The site is a Wrangler-deployed
# Worker, NOT Cloudflare Pages, so pushes never auto-build without this —
# before this workflow existed, deployment was a manual `npm run deploy`.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # GitHub evicts a cache after 7 days with no read/restore, no exception, and
  # this isn't a setting anything can override. During a quiet stretch with
  # no pushes, the watermark cache below would otherwise lapse, so the very
  # next push after the gap pays the full one-time rebuild cost again. Twice
  # a week keeps it touched with margin either side of the 7-day window even
  # if one run happens to fail.
  schedule:
    - cron: '0 3 * * 0,3'  # Sunday and Wednesday, 3am UTC

concurrency:
  # Own group, not track-bot-commits — this workflow never commits or pushes
  # to git (it only builds and runs `wrangler deploy`), so it doesn't need to
  # serialize against the workflows that do (auto-captions, Instagram post/
  # boost) and share that group to avoid racing each other's pushes. Sharing
  # it anyway caused a real collision: a push touching src/assets/images/**
  # fires both deploy.yml and auto-captions.yml, they'd compete for the same
  # one-slot queue, and deploy would get cancelled (happened twice in one
  # session, 2026-08-23). cancel-in-progress: true is safe here in a way it
  # isn't for the bot-commit group — a newer deploy always supersedes an
  # older one, unlike cancelling a git push mid-flight, so a burst of quick
  # pushes now just deploys the last one instead of queuing every
  # intermediate build.
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Originals live in Cloudflare R2 now, not git — moved off Git LFS
      # 2026-08-26 to remove the recurring LFS-bandwidth-cost risk (a real
      # incident: a day of active editing blew through the free LFS quota
      # and blocked every deploy until it reset). This downloads the current
      # set into src/assets/images/ before the build, replacing the old
      # `git lfs pull` step.
      #
      # No caching here on purpose: R2 has zero egress fees, so
      # re-downloading everything each deploy costs nothing in money, only a
      # few minutes of build time. The watermark cache below is what
      # actually matters for build speed, and it still works fine — the
      # downloaded bytes are identical each time a photo hasn't changed, so
      # its content hash (and therefore the cache key) doesn't move.
      - name: Sync images from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-images-from-r2.mjs

      # Cache the watermark outputs between runs. src/assets/watermarked/ and
      # public/ig/ are git-ignored (regenerated at build), so without this the
      # watermark script re-stamps ALL images every deploy (~15 min for 470+).
      # Restoring the cache lets watermark.mjs's content-hash manifest skip
      # everything unchanged and only process new/edited photos.
      #
      # Version suffix in the key: cache keys are immutable once created — a
      # save under an existing key silently no-ops, and the content-hash
      # manifest only reprocesses a photo when the SOURCE bytes change, not
      # when watermark.mjs's own logic changes. So any change to how outputs
      # are generated needs a fresh cache to actually apply to the existing
      # library, not just new photos — bump this suffix whenever that
      # happens (v2: cache existed before the manifest did; v3: ig/ versions
      # started getting watermarked too).
      - name: Cache watermarked + ig outputs
        uses: actions/cache@v4
        with:
          path: |
            src/assets/watermarked
            public/ig
          key: watermark-v3-${{ runner.os }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: |
            watermark-v3-${{ runner.os }}-

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
