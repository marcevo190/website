name: Deploy to Cloudflare

# Builds the site (watermark + astro) and uploads to the Cloudflare Worker
# (wrangler.json) on every push to main. The site is a Wrangler-deployed
# Worker, NOT Cloudflare Pages, so pushes never auto-build without this —
# before this workflow existed, deployment was a manual `npm run deploy`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: track-bot-commits
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # Build needs the real image bytes, not LFS pointers

      - name: Setup Git LFS
        run: git lfs install

      # Cache the watermark outputs between runs. src/assets/watermarked/ and
      # public/ig/ are git-ignored (regenerated at build), so without this the
      # watermark script re-stamps ALL images every deploy (~15 min for 470+).
      # Restoring the cache lets watermark.mjs's content-hash manifest skip
      # everything unchanged and only process new/edited photos.
      #
      # "-v2" in the key: cache keys are immutable once created — a save
      # under an existing key silently no-ops. A "watermark-..." cache
      # already existed from before watermark.mjs tracked a manifest file,
      # so every run kept restoring that manifest-less cache and could never
      # save its freshly-built manifest back under the same key, defeating
      # the skip logic completely. Bump this suffix again if the cache
      # scheme changes and needs a clean slate.
      - name: Cache watermarked + ig outputs
        uses: actions/cache@v4
        with:
          path: |
            src/assets/watermarked
            public/ig
          key: watermark-v2-${{ runner.os }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: |
            watermark-v2-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
