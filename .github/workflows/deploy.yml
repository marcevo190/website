name: Deploy to Cloudflare

# Builds the site (watermark + astro) and uploads to the Cloudflare Worker
# (wrangler.json) on every push to main. The site is a Wrangler-deployed
# Worker, NOT Cloudflare Pages, so pushes never auto-build without this —
# before this workflow existed, deployment was a manual `npm run deploy`.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # GitHub evicts a cache after 7 days with no read/restore, no exception, and
  # this isn't a setting anything can override. During a quiet stretch with
  # no pushes, both the LFS cache and the watermark cache would otherwise
  # lapse, so the very next push after the gap pays the full one-time rebuild
  # cost again (confirmed happening on 2026-08-22, after ~2 weeks blocked on
  # the LFS budget). Twice a week keeps them touched with margin either side
  # of the 7-day window even if one run happens to fail.
  schedule:
    - cron: '0 3 * * 0,3'  # Sunday and Wednesday, 3am UTC

concurrency:
  group: track-bot-commits
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # lfs:false here on purpose — actions/checkout's built-in LFS fetch has
      # no cache of its own, so it re-downloads the ENTIRE photo library from
      # GitHub's LFS server on every single push. GitHub's free LFS bandwidth
      # quota is small (1GB/month) and a day of active editing (many small
      # pushes) blew through it in one session, breaking every deploy until
      # the quota resets. Fetching LFS objects ourselves below, through a
      # cache, means only new/changed photos actually hit the LFS server —
      # unchanged ones get restored from the cache instead.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Git LFS
        run: git lfs install --local

      # Restores previously-downloaded LFS blobs into .git/lfs before we ask
      # git to pull — git lfs pull only fetches objects it can't already find
      # locally, so a cache hit here means little to no LFS bandwidth used at
      # all. Key doesn't need to be exact: restore-keys falls back to the
      # most recent cache, and `git lfs pull` fills in whatever's missing.
      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Git LFS pull
        run: git lfs pull

      # Cache the watermark outputs between runs. src/assets/watermarked/ and
      # public/ig/ are git-ignored (regenerated at build), so without this the
      # watermark script re-stamps ALL images every deploy (~15 min for 470+).
      # Restoring the cache lets watermark.mjs's content-hash manifest skip
      # everything unchanged and only process new/edited photos.
      #
      # Version suffix in the key: cache keys are immutable once created — a
      # save under an existing key silently no-ops, and the content-hash
      # manifest only reprocesses a photo when the SOURCE bytes change, not
      # when watermark.mjs's own logic changes. So any change to how outputs
      # are generated needs a fresh cache to actually apply to the existing
      # library, not just new photos — bump this suffix whenever that
      # happens (v2: cache existed before the manifest did; v3: ig/ versions
      # started getting watermarked too).
      - name: Cache watermarked + ig outputs
        uses: actions/cache@v4
        with:
          path: |
            src/assets/watermarked
            public/ig
          key: watermark-v3-${{ runner.os }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: |
            watermark-v3-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
