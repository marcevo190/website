name: Validate category wiring

# Guards the "new event" checklist — catches photo folders that were added to
# src/assets/images but never wired into the shared category list or events.
# Fails the check on errors; warnings (e.g. captions not yet written) pass.

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Filenames only, no image bytes — photos live in R2 now, not git (see
      # CLAUDE.md), so src/assets/images/ is empty on a fresh checkout unless
      # this creates the placeholder files validate.cjs's readdirSync scan
      # expects.
      - name: Sync image filenames from R2 (shallow)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-images-from-r2.mjs --shallow

      - name: Run validation
        run: node scripts/validate.cjs
