name: Instagram Auto-Post

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 8am UTC
    - cron: '0 17 * * *'  # Daily at 5pm UTC — second post now that there's enough photo backlog
  workflow_dispatch:        # Manual trigger from GitHub UI

# Serialize with the boost/auto-captions workflows: all of them commit
# and push to main, and concurrent pushes to the same tracked files can race.
# cancel-in-progress: false means a second run simply waits its turn.
concurrency:
  group: track-bot-commits
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false  # Don't download image files — we only need filenames
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post next photo to Instagram
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: node scripts/instagram-post.cjs

      - name: Commit updated queue
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add post-queue.json
          git diff --staged --quiet || git commit -m "[CI Skip] chore: update Instagram post queue"
          # No pull --rebase here: with lfs:false checkouts git misreads the
          # LFS-tracked weekly.mp4 as unstaged changes and refuses to rebase.
          # The shared concurrency group (track-bot-commits) serializes bot
          # commits, so a plain push can't race another one.
          git push
