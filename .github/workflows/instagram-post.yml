name: Instagram Auto-Post

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 8am UTC
    - cron: '0 17 * * *'  # Daily at 5pm UTC — second post now that there's enough photo backlog
  workflow_dispatch:        # Manual trigger from GitHub UI

# Serialize with the boost/auto-captions workflows: all of them commit
# and push to main, and concurrent pushes to the same tracked files can race.
# cancel-in-progress: false means a second run simply waits its turn.
concurrency:
  group: track-bot-commits
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Filenames only, no image bytes — photos live in R2 now, not git (see
      # CLAUDE.md). instagram-post.cjs's collectImages() would otherwise see
      # every category as empty and never post anything.
      - name: Sync image filenames from R2 (shallow)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-images-from-r2.mjs --shallow

      - name: Post next photo to Instagram
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: node scripts/instagram-post.cjs

      - name: Commit updated queue
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add post-queue.json
          git diff --staged --quiet || git commit -m "[CI Skip] chore: update Instagram post queue"
          # No pull --rebase here — the shared concurrency group
          # (track-bot-commits) already serializes bot commits, so a plain
          # push can't race another one.
          git push
