name: Instagram Weekly Reel

on:
  schedule:
    - cron: '30 17 * * 0'  # Sundays at 5:30pm UTC — catch the race-day crowd
  workflow_dispatch:         # Manual trigger from GitHub UI (builds even without the webhook secret)

# Serialize with the post/boost/auto-captions workflows — this job also
# commits and pushes to main (the reel video). See instagram-post.yml.
concurrency:
  group: track-bot-commits
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check configuration
        id: config
        env:
          MAKE_REEL_WEBHOOK_URL: ${{ secrets.MAKE_REEL_WEBHOOK_URL }}
        run: |
          if [ -n "$MAKE_REEL_WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
          # Scheduled runs without the secret do nothing; manual runs still build (for testing)
          if [ -n "$MAKE_REEL_WEBHOOK_URL" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "MAKE_REEL_WEBHOOK_URL secret not configured — skipping scheduled reel."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.build == 'true'
        with:
          lfs: false  # Photos are fetched from trackmarc.com/ig/, not from LFS
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.config.outputs.build == 'true'
        with:
          node-version: "22"

      - name: Install ffmpeg
        if: steps.config.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # weekly.mp4 is Git LFS-tracked (keeps it out of git history). Install
      # the local hooks so the pre-push hook uploads the LFS blob on `git push`
      # below — otherwise Cloudflare would receive a bare pointer and fail.
      - name: Enable Git LFS
        if: steps.config.outputs.build == 'true'
        run: git lfs install --local

      - name: Build weekly reel
        if: steps.config.outputs.build == 'true'
        run: node scripts/instagram-reel.cjs build

      - name: Commit reel so Cloudflare serves it
        if: steps.config.outputs.build == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/reels
          # No [skip ci] here — the Cloudflare build must run to serve the video
          git diff --staged --quiet || git commit -m "chore: weekly Instagram reel"
          # No pull --rebase here: with lfs:false checkouts git misreads LFS
          # pointers as unstaged changes and refuses to rebase. Plain push,
          # same as the daily post workflow; a rare race just retries next week.
          git push

      - name: Wait for this build's video to go live
        if: steps.config.outputs.configured == 'true'
        run: |
          # Poll the live reel-meta.json until it carries THIS run's build stamp —
          # a fixed sleep breaks whenever the Cloudflare build queue is busy, and
          # checking only the mp4's existence would pass on last week's video.
          expected=$(node -e "console.log(require('./public/reels/reel-meta.json').built_at)")
          echo "Waiting for build stamped: $expected"
          for i in $(seq 1 50); do
            if curl -s "https://trackmarc.com/reels/reel-meta.json" | grep -q "$expected"; then
              echo "Video live after ~$((i*30))s"
              exit 0
            fi
            sleep 30
          done
          echo "Video still not live after 25 minutes — giving up"
          exit 1

      - name: Post reel to Instagram
        if: steps.config.outputs.configured == 'true'
        env:
          MAKE_REEL_WEBHOOK_URL: ${{ secrets.MAKE_REEL_WEBHOOK_URL }}
        run: node scripts/instagram-reel.cjs send
