name: One-off - Migrate remaining photos to R2

# Temporary, manual-only workflow for the R2 migration. This Mac has no
# git-lfs binary, so it can't pull the real bytes for categories still
# LFS-tracked here (formula, endurance, rally, gt, car-shows, iccr,
# instagram-only, plus 40 still-pointer files in bimmerfest). GitHub-hosted
# runners already have git-lfs, so this does the one real pull needed and
# uploads the results to R2. Delete this file once the migration is done —
# it's a one-time tool, not part of the regular pipeline.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upload remaining categories to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for cat in formula endurance rally gt car-shows iccr instagram-only bimmerfest; do
            echo "=== $cat ==="
            node scripts/upload-photos-to-r2.mjs "$cat" "src/assets/images/$cat"
          done
